# Measured constants. Each one carries what was measured to land on it - change them by
# measuring again, not by taste. Overridden by anything set in lektor.toml.
# Secrets never live here. They come from the environment or from the project .env:
# ELEVENLABS_API_KEY, OPENROUTER_API_KEY.

[paths]
# Set this on a single-platform install - Linux, macOS, or Windows without WSL - and it wins over
# the pair below. The pair exists only for the split setup this project grew up in, where the
# sources sit on a Windows drive that one half of the pipeline addresses as E:\Filmy and the other
# as /mnt/e/Filmy, with both halves reading this same file. Left empty, the platform picks:
# input_dir_windows on Windows, input_dir_wsl everywhere else.
input_dir = ''

input_dir_windows = 'E:\Filmy\Serial.S01'
input_dir_wsl = '/mnt/e/Filmy/Serial.S01'
work_subdir = '_lektor'
output_subdir = '_lektor/output'
ffmpeg_windows = 'C:\ffmpeg\bin\ffmpeg.exe'
ffprobe_windows = 'C:\ffmpeg\bin\ffprobe.exe'
ffmpeg_wsl = 'ffmpeg'
ffprobe_wsl = 'ffprobe'

[extract]
subtitle_language = 'pol'
reject_title_patterns = ['SDH', 'forced', 'Forced']
audio_stream = 'a:0'
downmix_channels = 2
downmix_rate = 48000

[translate]
# A film with no Polish subtitle track used to stop at extract ("no 'pol' subtitle stream –
# skipped"). With this section it is translated instead: extract pulls a foreign TEXT subtitle,
# the translate stage turns it into <base>.srt, and every later stage reads that file exactly as
# it reads an extracted Polish one. Plan and reasoning: docs/translate.md.
#
# auto    translate only when the film has no usable Polish text track - the Polish track, when
#         there is one, is extracted exactly as before and nothing here runs;
# always  translate even when a Polish track exists (to compare the two, or because it is bad);
#         a film with nothing to translate from still gets its Polish track, with a warning;
# never   the old behaviour: no Polish track, no episode.
# A Polish track that exists only as a bitmap (PGS, VobSub) counts as absent under 'auto', since
# the alternative is the same skipped episode it always was. Changing this and rerunning extract
# moves the <base>.srt the other mode left aside (<base>.srt.bak-*) rather than keep it under the
# new label; whatever was built from the old text afterwards needs redoing.
mode = 'auto'

# Where the foreign text comes from. 'subs' is a text subtitle track in the film, and a film with
# none is skipped as it was before. 'asr' is the film's own audio, transcribed by the transcribe
# stage ([transcribe] below), even when a subtitle track is there. 'auto' means subs, then asr:
# the audio only for a film with no text subtitle at all - and, under mode 'always', never for a
# film that has its Polish track, which then keeps it rather than be swapped for a transcript.
source = 'auto'

# 'auto' ranks the film's text tracks: the language of the audio first (a translation of what the
# actors actually say), then English, then anything else, in stream order. A tag such as 'eng' or
# 'ger' takes only that language and skips the episode when it is not there (or, under source
# 'auto', transcribes the audio instead). Two- and three-letter codes and the
# bibliographic/terminology pairs (ger/deu, fre/fra) are the same language. For transcription a
# tag here is the language Whisper is told; 'auto' tells it the audio track's own tag, and lets it
# detect the language only when the track has none. Any spelling of a language Whisper knows will
# do; one it does not know is passed over, and the plan and the stage say so.
source_language = 'auto'

# Within one language, a plain dialogue track is preferred over SDH. SDH carries "[door creaks]"
# and speaker labels that would be translated and then stripped again by clean.strip_patterns, so
# it is the fallback rather than the choice. It stays the preferred ALIGNMENT reference all the
# same - see speech.find_reference_srt - because for that job the stutters it keeps are an asset.
prefer_plain_dialogue = true

# NOT MEASURED ON TRANSLATION. Picked from what the script notes measured on condensation: luna-
# pro thinks on every call (3681 reasoning tokens against luna's 222) and bills the same rate as
# luna ($0.20/$1.20 per Mtok). Whether that buys anything for a faithful translation, where there
# is no character budget to count against, nobody here has checked.
openrouter_model = 'openai/gpt-5.6-luna-pro'
# Asked only for the cues the primary could not produce after its targeted retry. A different
# model rather than a re-roll, so a model-specific failure - a refusal, an outage, a reply format
# it keeps getting wrong - is not simply repeated. Also unmeasured on this task. Empty disables it.
fallback_model = 'openai/gpt-5.6-terra'
# Cues that came back missing or failed the checks below get ONE more call to the primary that
# names them and says why, before the fallback is asked. The [script] key of the same name does
# not reach this stage. What the retry buys on translation is unmeasured; false sends the misses
# straight to the fallback model.
retry_misses = true
# No openrouter_base here: translate uses [script]'s, so the endpoint is spelled in one place.
reasoning_effort = 'medium'
# The condensation figure (206/210 in budget at 0.3 against 92/210 at the default) was about
# counting characters, which translation does not do. Kept at the same value untested rather than
# guessed at; null sends no temperature at all.
temperature = 0.3
# A whole episode comes BACK in full here, unlike condensation, which returns only the marked
# cues: 600 cues at ~45 characters is ~27 000 characters of Polish, roughly 9 000 output tokens
# before any reasoning. 64000 leaves room for both; it is an estimate, not a measurement.
max_tokens = 64000
structured_outputs = true
max_retries = 4
timeout_s = 900
request_gap_ms = 400

# The whole episode goes in one call, for the same reason condensation does it: who speaks to
# whom, ty or pan, which pronoun a line points back to - all of it is decided by context that a
# slice of the episode does not carry. Above this many characters of prompt it is split into
# contiguous chunks, which is a fallback for an episode that will not fit, not a mode.
max_prompt_chars = 200000

# Sanity bounds on each returned line, as a ratio of Polish to source characters. Polish runs
# longer than English, so the upper bound is loose; the lower one catches a SHORTENED line, which
# is condensation and is not this stage's job - `script` condenses later, against the real time
# window. Lines under min_check_chars are exempt from the lower bound: "Yeah." -> "No." is a
# translation, not a cut. Not tuned on data: these reject only the absurd.
max_len_ratio = 3.0
min_len_ratio = 0.25
min_check_chars = 24

# Reuse lines from <base>.translated.json instead of paying for them again. The key is the source
# line, its start time (so two identical "I'm ready." cards spoken by different people stay two
# entries), the source language, the model, the effort and a hash of the prompt.
reuse_previous = true

# Reference figure for `cost` until an episode has really been translated. 0 because nothing has
# been: `cost` says "unmeasured" rather than printing a made-up number, and switches to what
# OpenRouter billed (usage.cost, in <base>.spend.json) as soon as there is one.
measured_usd_per_episode = 0.0

# Polish subtitles as a by-product, only for episodes this stage translated - a Polish track that
# was already in the film is never duplicated. off: nothing. sidecar: <film>.pl.srt beside the
# film, next to the .mka, which every player picks up by name. mux: added to the remuxed .mkv as a
# subtitle stream (language pol, not default), which only happens with `--to mux`. `--subs` on the
# command line overrides this for one run. What goes out is the faithful translation in <base>.srt
# - hand edits included - and never the condensed lektor script.
subtitles = 'off'
subtitle_title = 'Polski (AI)'

[transcribe]
# Path 3 of docs/translate.md: a film with no text subtitle at all - or translate.source = 'asr' -
# has its audio transcribed into subs/<base>.asr.<lang>.srt, which translate then reads exactly as
# it reads a subtitle track. NOTHING IN THIS TABLE HAS BEEN MEASURED: it was written where there is
# no GPU and no faster-whisper. A value whose comment names its source is the library's own default
# or the common Whisper practice; the rest are this project's own choices, untested, and say so.
# Measure on a real episode before tuning by taste.
#
# Where faster-whisper runs - never in the pipeline's own interpreter, by the route forced
# alignment takes (speech.aligner): 'local' feeds the script to the python in `venv`, 'docker' to
# the container below, and 'auto' takes the venv when one is configured and docker otherwise. With
# neither, the stage stops before cutting any audio and says how to install one.
runner = 'auto'
# A venv with faster-whisper installed (it brings ctranslate2; CUDA needs the cuBLAS/cuDNN wheels,
# see docs/install.md). Empty means the container.
venv = ''
# Empty means speech.asr_container - the borrowed container, whose resident service is itself a
# faster-whisper large-v3, so the library is already there. This loads a SECOND copy of the model
# beside the resident one; how much VRAM that takes on top has not been measured.
container = ''

# large-v3 because it is what the borrowed container already runs and the most accurate of the
# multilingual checkpoints faster-whisper ships; nothing here compared it to a smaller one. The
# first run downloads it (~3 GB) into the Hugging Face cache of whichever interpreter runs it.
model = 'large-v3'
# 'auto' lets ctranslate2 pick CUDA when it sees a GPU; 'default' then means float16 on CUDA and
# int8 on the CPU, the library's own choice. 'cpu' works and is far slower; how much slower on an
# episode is unmeasured.
device = 'auto'
compute_type = 'default'
# faster-whisper's default beam.
beam_size = 5
# The library's built-in Silero VAD, which cuts silence out before Whisper sees it - long silences
# are where Whisper invents text. The three numbers are faster-whisper's VadOptions defaults.
vad = true
vad_threshold = 0.5
vad_min_silence_ms = 2000
vad_speech_pad_ms = 400
# Off, against Whisper's default of on: feeding the previous segment's text back as the prompt is
# what lets one hallucinated phrase repeat for minutes. Widely reported, not measured here.
condition_on_previous_text = false
# How long one episode's transcription may run before it counts as failed. Chosen here; how long
# an episode actually takes is unmeasured.
timeout_s = 7200

# --- Hallucination filters: plain Python over what came back, every drop recorded in
# <base>.asr.json with its reason. A segment goes when:
#
# no_speech_prob is above this AND avg_logprob below the next - the pair Whisper's own decoder uses
# to call a window silence. Either alone also fires on a quiet line decoded with confidence.
max_no_speech_prob = 0.6
min_avg_logprob = -1.0
# gzip compression ratio of its text above this, Whisper's own threshold for "repetitive".
max_compression_ratio = 2.4
# one phrase of up to loop_max_ngram words repeated back to back at least loop_min_repeats times
# and loop_min_words words in all: "No, no, no, no!" is a line, the same sentence eight times in one
# segment is a decoder stuck. All three chosen here, unmeasured.
loop_max_ngram = 6
loop_min_repeats = 4
loop_min_words = 12
# the same text more than this many segments in a row - a loop across Whisper's 30 s windows, where
# each copy passes every check on its own. The first copies are kept: "Yeah." "Yeah." is speech.
# Chosen here, unmeasured.
max_identical_run = 2
# less than this share of it inside the VAD's speech regions: decoded over music or silence that
# the VAD padding let through. Without the regions (an older faster-whisper) nothing is dropped.
# Chosen here, unmeasured.
min_speech_overlap = 0.3
# a phrase from this list makes up at least blacklist_min_cover of its text. These are phrases
# Whisper is publicly known to produce over silence and credits, learned from captioned video -
# none was observed on this project's material. Case and punctuation do not matter; whole words.
blacklist = [
    'thanks for watching', 'thank you for watching', 'thank you so much for watching',
    'please subscribe', 'like and subscribe', 'subscribe to my channel',
    "don't forget to subscribe", 'see you in the next video',
    'subtitles by the amara org community', 'subtitles by', 'transcription by',
    'transcribed by', 'translated by', 'captions by',
    'untertitel im auftrag des zdf', 'untertitel der amara org community',
    "sous titres réalisés par la communauté d'amara org", 'sous titres par',
    'subtítulos realizados por la comunidad de amara org',
    'napisy stworzone przez społeczność amara org', 'dziękuję za uwagę',
]
# Chosen here, unmeasured.
blacklist_min_cover = 0.6

# --- Cutting into cues. Real subtitles, not Whisper's segments: a segment can run 30 s and three
# sentences. These are the common broadcast/streaming limits - two lines of 42 characters - and the
# release this pipeline was built on keeps 82-84 ms between cards (speech.py), hence min_gap_ms.
max_line_chars = 42
max_lines = 2
max_cue_ms = 6000
min_cue_ms = 1000
min_gap_ms = 80
# A silence this long always ends a cue; a shorter one past split_pause_ms is the preferred place
# to split a cue that does not fit, after a sentence end and before a comma. Both chosen here,
# unmeasured.
max_pause_in_cue_ms = 1000
split_pause_ms = 250
# How long a card stays up past its last word, where the next card leaves room. Unmeasured.
linger_ms = 300
# Whisper's word times were measured 316 ms EARLY at utterance starts (p50, see speech.py). That is
# not corrected here by default: these cues are only the grid, `speech` aligns the transcript
# against the audio afterwards and `retime` moves each line onto its aligned first word - the same
# as for an authored subtitle, which leads speech on purpose. A value here shifts every cue start
# later by that much; 0 leaves the placement to alignment.
onset_shift_ms = 0

[script]
# Measured on 210 overflowing cues from one real episode, whole-episode prompt, effort medium.
# This model is a lottery, and that is fine because the losing ticket is detectable for free.
# Seven identical calls landed 207, 206, 205, 111, 93, 69 and 67 cues inside budget, and quality
# tracks how much the model bothered to think, visible in the reply before anyone reads the text:
# 513 reasoning tokens gave 93/210, 2338 gave 111/210, 5520 gave 207/210. So the stage validates
# and re-rolls (see accept_fit_ratio) instead of buying a steadier model. Rejected alternatives:
# luna-pro 207-208 but $0.017-0.021, and it is just luna at high effort under another name;
# gemini-3.5-flash burned 46000 reasoning tokens and returned TRUNCATED JSON on two runs out of
# three at $0.43 each; gemini-3.5-flash-lite ignores reasoning entirely (0 tokens) for a steady
# but mediocre 108-132/210 at $0.021; gemini-3.6-flash 196/210 at $0.196; gpt-5.6-terra 158/210 at
# $0.037. PROMOTED to primary on measured prices rather than the table above. luna and luna-pro
# bill at the SAME rate - $0.20/Mtok in, $1.20/Mtok out, checked against the live catalogue - so
# luna-pro was never the expensive tier, only the one that thinks. Measured on one episode in a
# single run: luna spent 2220 reasoning tokens across 10 calls (222 a call, which is the declines-
# to-think mode this note already describes) for a best of 216/413, and luna-pro spent 14723
# across 4 (3681 a call, sixteen times more) to reach 234/413. Paying for thinking beats paying
# for draws.
openrouter_model = 'openai/gpt-5.6-luna'

# Fraction of the overflowing cues that must come back inside their budget for a whole-episode
# reply to be accepted. Below it the call is re-rolled up to max_rerolls times, keeping the best
# reply seen. At roughly 40% good rolls this averages ~2.3 calls, about $0.014 an episode -- still
# cheaper than any model that is steady on the first try.
accept_fit_ratio = 0.9

# Hard stop on re-rolling. After this the best reply so far is used and the shortfall is reported
# honestly rather than hidden; whatever still overflows gets sped up instead. Cut from 4 to 1 when
# the primary became luna-pro. Four rolls were sized for a LOTTERY - and for a ladder that, until
# the seed fix, was not rolling at all. A model that thinks on every draw does not need four
# chances; it needs one second opinion and then an honest accept.
max_rerolls = 1

# Reuse condensed lines from <base>.condensed.json instead of redrawing them. The key is (cleaned
# source text, budget_chars, openrouter_model, reasoning_effort, hash of CONDENSE_SYSTEM), so any
# change to the prompt, the model, the effort, the cleaning rules or the merge gate misses on
# exactly the lines it really changed and on no others. Measured per episode: re-running the
# pipeline after an upstream change costs $0.71 without this and $0.09 with it ($4.27 a season
# against $0.54), and the TTS bill it also saves is 14-65x larger. Two honest caveats. First,
# whole-episode condensation sees the entire dialogue as context, so a reused line was written
# under a slightly different context than a fresh one would be -- the alternative is paying for
# the whole episode every time, and the line itself was accepted against the same budget. Second,
# a cue the model FAILED on is never stored, so it gets another chance on the next run instead of
# a cached failure. `script --redraw` ignores the file for one run; `reuse_previous: false` is the
# permanent version. Deleting the file buys exactly one clean draw, because the run that redraws
# also writes it again.
reuse_previous = true

openrouter_base = 'https://openrouter.ai/api/v1'
# low is 3x cheaper but lands only 90/210 in budget; high costs 2x and adds nothing (206/210, 185
# s). Send {"effort": ...} only -- {"enabled": false} is HTTP 400 on these models.
reasoning_effort = 'medium'

# The whole episode goes in one call: $0.196 vs $0.433 per episode against the same model batched,
# and every cue is shortened against the full dialogue instead of three neighbours. Cues to
# shorten are marked inline as '[id] >>> SKROC DO N ZNAKOW <<< text' and the model returns only
# those. This replaced the old batch_size/context_window knobs; max_prompt_chars is the only way
# back to batching, and only for an episode too long to fit one call.
context_mode = 'whole_episode'

# Part of the measured winning call shape, not decoration: one whole-episode call with the same
# model and prompt landed 92/210 cues inside budget with the provider default and 206/210 at 0.3.
# Set it to null to send no temperature at all.
temperature = 0.3

# Reasoning effort is spent as a fraction of max_tokens, so omitting it starves the model: 62
# reasoning tokens and 139/210 in budget without it, against 5000+ and 205/210 with it. 48000
# covers 210 rewritten cues with room for thinking.
max_tokens = 48000

# Send response_format json_schema with strict true. OpenRouter routes to providers that support
# it, but enforcement is not guaranteed on every endpoint, so the reply is validated client-side
# regardless. If a provider refuses the schema outright the stage degrades to json_object for the
# rest of the run and says so.
structured_outputs = true

# After the first pass, cues that came back missing, empty, longer than the original or still over
# budget get ONE targeted second call that names them and the reason. Small prompt, small output,
# so it adds cents, not dollars.
retry_misses = true

# Above this the whole-episode prompt is split into contiguous segments (the batching fallback). A
# real 598-cue episode builds a 28 kB prompt, so this never triggers in practice; it exists so an
# absurdly long episode degrades instead of erroring.
max_prompt_chars = 400000

max_retries = 4
timeout_s = 600
# Reference figure for `cost` only, and only until an episode has really run. It must track
# openrouter_model AND the re-roll policy above, so it is the ~$0.014 an episode that luna
# averages at roughly 2.3 draws: a single clean draw of S02E01 (598 cues, 210 over budget) billed
# $0.0089, of which $0.0060 was the whole-episode call and $0.0029 the targeted retry. For
# comparison, the same episode through luna-pro in one draw billed $0.0233. Once
# <episode>.spend.json exists, `cost` reports what OpenRouter actually billed instead, read from
# usage.cost.
measured_usd_per_episode = 0.014

# Used when openrouter_model has burned every re-roll and still missed accept_fit_ratio. Re-
# rolling a model that has drawn badly five times in a row is throwing good money after bad; terra
# is steadier per draw (158/210 at effort medium against luna's swing between 67 and 207) and
# costs about 4x, which is worth it only here. The best reply across every draw from both models
# wins, so escalating can never make the result worse. CHANGED from gpt-5.6-terra, which was the
# wrong choice on the numbers already in this file. The bar this step exists to clear is
# accept_fit_ratio, 0.9 - and terra scores 158/210, which is 75%. It cannot reach the threshold it
# is escalated to reach, so it was a steadier way of failing, at $0.037 against luna-pro's
# $0.017-0.023. The old note compared terra's steadiness against LUNA's swing rather than against
# luna-pro, which is both steady and high: 207-208/210 on the same benchmark. And the reason luna-
# pro was rejected as the PRIMARY model - 'it is just luna at high effort under another name' - is
# an argument for it here: this file documents that luna's bad draws are draws where it declined
# to think (513 reasoning tokens gave 93/210, 5520 gave 207/210), so the right answer to a luna
# draw that did not think is the variant that always does. Re-measure this ladder now that re-
# rolls actually vary the seed: until that fix, 'luna re-rolled four times' was one draw billed
# five times, so every cost comparison involving the ladder was built on a draw count that never
# happened. Now gpt-5.6-luna-pro, reached after TWO luna draws rather than five. luna and luna-pro
# bill at the same rate ($0.20/$1.20 per Mtok); the difference is that luna-pro thinks - 3681
# reasoning tokens a call against luna's 222 - so escalation here buys effort, not a price tier.
# The ladder is a cheap filter: on ATVP material luna clears the bar on the first draw for cents,
# and only dense fansub material needs the escalation at all. Measured on one hard episode: five
# luna draws plus an escalation to terra cost $0.5926 (79% of it terra, which bills ten times the
# rate and still missed), the same ladder escalating to luna-pro cost $0.3034, and luna-pro alone
# cost $0.1796 for four calls. Nothing above luna-pro is worth putting here: terra bills
# $2.00/$12.00 per Mtok and sol/sol-pro $2.50/$15.00, terra scores worse and sol is unmeasured on
# this task.
fallback_model = 'openai/gpt-5.6-luna-pro'

# Extra draws from the fallback model beyond its first. Two attempts is the point of diminishing
# returns; past that the honest move is to accept and speed the stragglers up.
fallback_rerolls = 1

# Minimum spacing between the starts of two OpenRouter calls, enforced process-wide alongside a
# hard cap of 3 concurrent calls. A single episode is already one call per draw, so this is not
# for the pipeline: it is for everything around it - benchmarks fanning several models out at
# once, or two runs of the same episode briefly overlapping - which from the provider's side is
# one account hammering it and shows up as requests queueing behind each other.
request_gap_ms = 400

# Fitted per VOICE. Bill measures ms = 47 + 73.5 * chars (13.6 chars/s); Mateusz measured 80 +
# 73.4 and Janski 216 + 44.8 (22.3 chars/s). Those first two agreeing was a coincidence of two
# samples, not a property of the engine - Janski proved it by speaking 60% faster, which took the
# episode from 241 cues over budget to 29. Re-fit whenever voice_id changes or every budget in the
# episode is wrong. Do not fit on short lines alone: the fixed overhead dominates there and drags
# the slope.
# How far a speed-up bleeds into its neighbours, in seconds. A single line jumping to 1.2 while
# the ones around it sit at 1.0 is heard as the lektor suddenly hurrying; ramping the neighbours
# part of the way there makes the acceleration a gradient instead of a step. It also pays for
# itself: neighbours that finish earlier leave the crowded line more room, so it needs less speed-
# up than it did alone.
[timing]
# Fitted by tools/fit_duration.py on 36 lines spanning 6 to 170 characters, measured AFTER
# trim_silence at speed 1.0 - the same thing the pipeline consumes. Free fit wanted -131 + 68.17,
# and a negative fixed cost is not something an engine can do: it is a straight line paying for
# curvature. Forcing the intercept to zero costs almost nothing (R^2 0.9919 -> 0.9914), so that is
# what ships.\n\nThe previous values, 47 + 73.5, were not wrong because anything changed at
# ElevenLabs - the voice and model are the same and neighbour context moves duration by -9% to
# +6%, i.e. noise. They were fitted on the six CALIBRATION_LINES, which span 43 to 63 characters.
# Two parameters cannot be separated over a twenty-character window: the data cannot tell a fixed
# cost from a per-character one, so the split is decided by noise and every extrapolation inherits
# it. On the proper benchmark that model scores R^2 0.9625 with a worst case of 1668 ms and over-
# predicts by +436 to +892 ms across most length bands - which is why lines were being hurried
# that had all the time they needed.\n\nResidual spread is 333 ms whatever the model's shape,
# including one with curvature. That is the engine's own line-to-line variation and no formula
# will predict past it, which is the argument for the voice stage re-fetching whatever overran
# once the audio has been measured. Refit with tools/fit_duration.py after any change of voice or
# model.
overhead_ms = 0.0

# Fitted by tools/fit_duration.py on 36 lines spanning 6 to 170 characters, measured AFTER
# trim_silence at speed 1.0 - the same thing the pipeline consumes. Free fit wanted -131 + 68.17,
# and a negative fixed cost is not something an engine can do: it is a straight line paying for
# curvature. Forcing the intercept to zero costs almost nothing (R^2 0.9919 -> 0.9914), so that is
# what ships.\n\nThe previous values, 47 + 73.5, were not wrong because anything changed at
# ElevenLabs - the voice and model are the same and neighbour context moves duration by -9% to
# +6%, i.e. noise. They were fitted on the six CALIBRATION_LINES, which span 43 to 63 characters.
# Two parameters cannot be separated over a twenty-character window: the data cannot tell a fixed
# cost from a per-character one, so the split is decided by noise and every extrapolation inherits
# it. On the proper benchmark that model scores R^2 0.9625 with a worst case of 1668 ms and over-
# predicts by +436 to +892 ms across most length bands - which is why lines were being hurried
# that had all the time they needed.\n\nResidual spread is 333 ms whatever the model's shape,
# including one with curvature. That is the engine's own line-to-line variation and no formula
# will predict past it, which is the argument for the voice stage re-fetching whatever overran
# once the audio has been measured. Refit with tools/fit_duration.py after any change of voice or
# model.
ms_per_char = 67.0

# Speaking rate of the chosen voice at speed=1.0. Run `lektor.py calibrate` to measure it for
# real; the measured value is cached per backend+voice+model in the work dir. What it actually
# drives is the ElevenLabs backend's per-line speed prediction. It reaches the character budgets
# ONLY through budget_for's 1000/cps fallback, i.e. with ms_per_char at 0; with ms_per_char set,
# calibrating changes no budget at all. Backends that control duration directly (piper) ignore it
# entirely.
chars_per_second = 14.5

# How far a line may run past its own cue, into the silence that follows. Raised from 700 to 1500
# because a real lektor routinely lags the picture and talks across the start of the next line;
# the borrow is still capped by the actual gap minus gap_guard_ms, so this only helps where there
# is real silence to take. Wider windows also mean less for the LLM to shorten, which makes the
# script stage cheaper as well as the delivery less rushed.
max_borrow_ms = 1500

gap_guard_ms = 120
# Silence held on BOTH sides of a screen card - a shop sign, a chyron, a location caption. A card
# is not part of the conversation, and read flush against the dialogue around it the lektor sounds
# like he is answering the actor: S03E07 opens on five shop signs and they land as dialogue. The
# pause is taken from the neighbours' borrowed window, which is silence on the timeline anyway, so
# it costs a dialogue line nothing until the borrow runs out. A card that cannot have both pauses
# and still be said is moved to the head of the next utterance instead, which pushes that line
# back by the card plus one pause. Set 0 to place cards exactly as the subtitle timed them.
card_pause_ms = 300
safety = 0.96
# Ceiling on voice_settings.speed. 1.2 is the API's own hard limit, verified: 1.25 comes back as
# invalid_voice_settings, "expected to be greater or equal to...". This is the engine genuinely
# reading faster, with its prosody intact, which is why it is the only time compression used.
max_speed = 1.2

# Post-hoc time stretch, DISABLED at 1.0 by owner decision after listening: atempo resamples
# finished speech and the artefacts are worse than an honestly faster reading. Anything that will
# not fit at max_speed is simply allowed to run long into the silence that follows, which is what
# a real lektor does anyway. Raise it only if that lag starts to matter more than the artefacts.
max_atempo = 1.0

# Multiplier on the character budget handed to the LLM. 1.0 means the budget is exactly what fits
# at the voice's natural rate. It was briefly 1.18 to stop the model abbreviating, and that was
# the wrong lever: the extra room came back as fuller lines that overran their windows, 168 of
# them by 423 ms on average, and with atempo disabled that turns straight into the lektor lagging
# the picture. Abbreviations are a prompt problem and are fixed in the prompt; the budget stays
# honest.
budget_slack = 1.0

# Extra budget for cues containing digits, on top of budget_slack. Spelling a number out
# multiplies its length - "14" becomes "czternascie" - so on an ordinary budget the model pays for
# the expansion by dropping a number, which defeats the point. Only a handful of cues per episode
# carry digits, so the lag this buys back is negligible.
number_slack = 1.4

# Ceiling on how far a line may be pushed later when the actor had not started speaking yet, and
# the switch for the whole feature: 0 disables it and the placement goes back to the card start.
# 600 ms because that is where a nudge stops being one. The score gate does not bound the lead on
# its own -- the worst lead passing it is +2526 ms, on a two-word cue the aligner guessed at -- so
# this cap is the thing that actually contains a bad anchor, and only 6 of 180 delays across the
# season are held by it. Re-timing every line to the acoustic onset was measured as a NET LOSS
# (-50.8 s of room, lines needing a speed-up 4 -> 41), so this is deliberately a nudge on a
# handful of lines and never a re-timing.
max_delay_ms = 600

# Smallest lead worth correcting. Below it the lektor is heard as being on the card, not ahead of
# it. Measured over all six episodes: 182 of 3443 lines lead by more than 300 ms, 35 by more than
# 500, 8 by more than 800.
delay_min_lead_ms = 300

# How much of the lead is kept rather than eaten. A card goes up a median 73 ms before the first
# word and that lead is working room, not error; a lektor starting exactly on the first syllable
# sounds late. So the delay closes the gap to this, never to zero.
delay_keep_lead_ms = 100

# Alignment confidence a card's onset must clear before anything is moved. Higher than the pause
# gate's 0.5 on purpose: a pause gate that acts on a bad alignment refuses a merge, a delay that
# acts on one moves a line that was never early. The +2003 ms leads reported by the ASR brief all
# sit below this.
delay_min_score = 0.8

# How far apart a Polish card and its English counterpart may start and still be treated as the
# same card. The aligner reads the English track and the lektor is written from the Polish one;
# 3130 of 3443 cues start on a byte-identical timestamp and the rest are seconds away, so widening
# this to 200 ms buys 10 cues in 3443 and to 400 ms buys 28. It is a safety margin, not a search.
delay_match_tol_ms = 120

speed_smooth_s = 6.0
# Fraction of the computed excess speed actually applied, once the neighbours are sharing the
# load. 0.88 gives back about a fifth of a typical speed-up.
speed_relax = 0.88

# How long after its subtitle card the lektor starts, so the original actor is heard first. That
# is the convention, not a preference: the viewer needs to register whose voice it is before the
# translation covers it, and subtitle cards are habitually set a little AHEAD of the speech.
# `retime` does this properly from forced-aligned word onsets and should win wherever it has them;
# this is the fallback for material where the English reference does not pair with the Polish grid
# - on The Death of Robin Hood it matched 13 cues of 921, so nothing moved at all. Cost, measured
# on 810 cues: at 300 ms, 33 lines no longer fit naturally and get read faster, against a median
# slack of 1316 ms. Cards with under 400 ms of room left are exempted.
lead_in_ms = 550

# How long before a shot change a line must be finished. A lektor who runs out exactly as the
# picture cuts sounds as though the cut chopped him off - the ear pairs the two events even when
# nothing was truncated. The slot is shortened to end this far before the next cut and the speed
# planner is left to fit the words into what remains; a card that would be left under 400 ms keeps
# its own end instead, because landing on a cut beats being squeezed past what a voice can say.
# Measured on 810 cues against 541 scdet cuts: 500 ms shortens 189 lines and puts 136 of them over
# their natural pace, against 33 with no guard. Useless without trustworthy cut data - the
# previous detector found 187 cuts where scdet finds 541, and at that density this rule would do
# nothing.
cut_guard_ms = 500

# Multiplier on the fitted duration model for lines made of number words, applied in proportion to
# how much of the line is numerals. What it really guards against, measured after the fact: an
# engine reading a RUN OF NUMERALS WITH NO TERMINAL PUNCTUATION drifts - it treats the line as a
# list going nowhere, slows on every item and falls in pitch, and the owner described the result
# as sounding like the reader was about to die. A written-out year came back at 87.6 ms per
# character against the model's 73.5; the same line with a full stop came back at 73.8, i.e.
# exactly the model. Rewriting the numeral does nothing: hyphens saved 70 ms of 4030, closing the
# spaces 120.
#
# A GLOBAL 'add a full stop to every unterminated line' was measured and REJECTED. On ordinary
# sentences the effect is noise - -4.3%, -2.7%, and one line got 4.2% LONGER - so it would have
# invalidated the TTS cache of 55 lines to buy nothing on 53 of them. It is also wrong on the
# merits, which matters more than the cost: a cue ending in a comma is usually one sentence split
# across two cards, and closing it with a full stop puts a false ending inside a thought. In this
# film those cues are verse, where the comma carries the metre. A broken-up sentence is the merge
# stage's problem, not punctuation's.
#
# So the factor stays as a SAFE-DIRECTION error: it over-predicts duration, which costs at worst a
# 1% speed-up nobody hears, while under-predicting puts the lektor across a shot cut. Set to 1.0
# to switch it off. The voice stage also re-fetches anything that overran its slot once the audio
# has been measured, which catches whatever this misses.
numeral_drag = 1.2

# Line-to-line spread the duration model cannot predict, measured by tools/fit_duration.py as the
# residual standard deviation of the best fit - 333 ms, and it stays 333 ms whatever shape the
# model is given, including one with curvature. It is the engine's own variation, not a modelling
# failure. Used as a margin wherever a decision would otherwise treat the prediction as exact: the
# shot-cut guard only shortens a slot when the line fits with this much to spare. Refit it
# alongside overhead_ms and ms_per_char.
duration_sd_ms = 333.0

# The `speech` stage: what the actors and the editor did, measured off the video, written to
# <base>.speech.json. Costs nothing and calls nothing paid. Everything it produces is optional -
# the merge gate degrades to today's text-only rules whenever a signal is missing.
# Shortest silence written into the artefact. Half of merge_min_pause_ms, so the threshold can be
# lowered in config and re-measured without re-running the GPU; below that it is inter-word
# coarticulation, not a pause, and it would double the file for nothing.
# Ceilings, not expectations. Measured on S02E06: 18 s to extract the audio, 9 s to align 616 cues
# (234x realtime), 58 s for the shot cuts. These exist so a wedged container or an unreadable file
# becomes an error instead of a hang.
[speech]
# Where to find the English text the aligner is given, tried in order; {tag} is the S02E06 part of
# the filename, {base} the whole stem. English, because the acoustic model is English -
# WAV2VEC2_ASR_LARGE_LV60K_960H, which beat MMS_FA on this material 88 to 57 of 97 cues and is MIT
# rather than CC-BY-NC. Stream 3 first because it is the near-verbatim transcript: it keeps the
# 'Ooh', the stutters and the reaction sounds, so it transcribes what is uttered, while stream 2
# is the cleaned reading version (3054 of ~3670 cue texts identical, 589 only in stream 3). The
# Polish track is never a candidate.
reference_srt_patterns = ['subs/{tag}.eng3.srt', 'subs/{tag}.eng2.srt', 'subs/{base}.eng.srt']

audio_stream = 'a:0'
# The dialogue stem for free: on a 5.1 track the centre channel is where the voices are, so no
# source separation is needed - and none should be added, because the sibling yt-translator
# project MEASURED Demucs making alignment worse and dropped it, keeping exactly this band-pass.
# 120-7500 Hz is speech; dynaudnorm evens out the level so a whispered line aligns as well as a
# shouted one.
centre_filter = 'pan=mono|c0=FC,highpass=120,lowpass=7500,dynaudnorm'

# Fallback for a track that is not 5.1, where pan=mono|c0=FC has no centre channel to take.
# ffmpeg's own downmix is used instead and the artefact records which of the two ran, because a
# downmix carries the music and effects that the centre channel does not.
downmix_filter = 'highpass=120,lowpass=7500,dynaudnorm'

# Mean level, in dBFS, below which the extracted centre channel is not a dialogue stem at all and
# the downmix is taken instead. A 5.1 tag does not promise FC carries anything: the Netflix
# release of Grand Theft Auto VI: An Extended Look measured FC at -114 dBFS against -31 for L and
# R, and the aligner read 51 MB of silence and returned 0 of 468 cues without erroring. Speech
# that is present sits far above this: the same film's downmix measured -27 dBFS. -60 is the gap
# between those two worlds, not a threshold anything real sits near.
centre_min_mean_db = -60.0

# Aligner confidence below which a cue contributes no word times at all. Not decoration: cues
# scoring under 0.35 were measured at 0.314 mean ASR token recall against 0.901 for cues at 0.7
# and above, i.e. the low scorers are shouts over crowd noise where the times are guesses - and a
# guessed word time invents a silence that never happened, which is precisely what the pause gate
# would then act on. At 0.5, 475 of 616 cues on S02E06 qualify.
min_score = 0.5

# How much contiguous cue text is aligned in one pass. Measured against 120 s windows on a real
# episode: better scores (475 vs 393 of 616 cues), 2.6x less VRAM, 1.9x faster, and the two agree
# to 10 ms at the median. Do NOT drop to per-cue windows with a short pad: without a <star> token
# the aligner drags a cue's first word backwards onto whatever speech sits in the pad, fabricating
# the exact statistic this artefact exists to measure.
fa_window_s = 30

store_min_gap_ms = 150
detect_cuts = true
# Cores ffmpeg may use for shot detection, the only stage that decodes a whole episode of 1080p at
# full tilt. Capped at 14 of this machine's 16 by owner rule: other projects' containers share
# this WSL instance and must not be starved. Raising it to 16 buys a few seconds on a stage that
# already runs in about 70.
ffmpeg_threads = 14

# Legacy, for select='gt(scene,...)'. Kept so the old measurements in this file remain
# interpretable; the detector now used is scdet and its knob is scene_threshold_scdet.
scene_threshold = 0.35

# Which forced aligner to use: 'docker' hands the script to the container named below, 'local'
# runs the very same script with the interpreter in aligner_venv, and 'auto' picks local when that
# venv exists and docker otherwise. The container is INCIDENTAL to this project - it was recycled
# from a sibling repo because it already had torch on a GPU, not because anything here needs a
# container - and the local path is the simpler of the two, since the wav and the cues are already
# on this filesystem and nothing has to be copied in and out. It also matters for platforms:
# Docker Desktop runs Linux containers on a WSL2 or Hyper-V backend, so on a Windows box trying to
# avoid WSL the docker path drags in the very thing being avoided. With neither available the
# stage still degrades the documented way - the caller catches the failure and writes an artefact
# carrying shot cuts only, which costs the onset-based retiming and the pause half of the merge
# gate.
aligner = 'auto'

# A venv with torch and torchaudio and nothing else; the aligner needs no other dependency. Left
# empty by default so 'auto' keeps using the container that this machine already runs. Interpreter
# is found at bin/python or Scripts/python.exe, whichever exists, because the layout follows the
# venv that was created rather than the machine reading it.
aligner_venv = ''

# The container forced alignment runs INSIDE, by name. It is borrowed, not owned: it belongs to
# ~/projects/yt-translator, it holds a resident faster-whisper large-v3, and this stage neither
# calls its HTTP API nor writes into its source tree. It uses only the torchaudio 2.6 that is
# already installed there, which is why nothing has to be installed anywhere and why the torch pin
# must not be disturbed. One scratch directory under the container's /tmp is created and removed
# again. If the container is down, the stage says so and writes an artefact with shot cuts only.
asr_container = 'asr'

# Where the 16 kHz mono extract lands, about 67 MB per episode, deleted when the stage finishes.
# Empty means the system temp. Point it at fast local disk if the work dir is on a network or 9p
# mount, where writing that file is far slower than reading the video it came from.
tmp_dir = ''

ffmpeg_timeout_s = 3600
docker_timeout_s = 600
fa_timeout_s = 1800
# Threshold for ffmpeg's scdet, 0-100. Its default of 10 found ZERO cuts in ten minutes of this
# film; 5 found 44, against 29 for the old select='gt(scene,0.2)' on the same footage. Lower it
# further only against a measured count - a detector that fires on camera movement is worse than
# one that misses cuts, because the merge gate then refuses seams for no reason.
scene_threshold_scdet = 5

# Which decoder reads the video for the shot-cut pass: 'auto' sends 4K to NVDEC and keeps
# everything below it on the CPU, 'cpu' forces ffmpeg's own software decoder, and a decoder name
# (hevc_cuvid) forces that one. Measured on one minute of 2160p HEVC 10-bit, three planes of scdet
# each time: 47.3 s on the CPU, 12.1 s through NVDEC, 5.0 s with cuts_resize as well - and all
# three found the same six cuts, to the millisecond. At 1080p H.264 the CPU is the faster of the
# two (13.3 s against 20.7 s), so 'auto' leaves that where it was.
cuts_decoder = 'auto'
# Below this width 'auto' stays on the CPU. 2560 puts 2160p on the GPU and leaves 1080p and 1440p
# on the side of the crossover where they were measured faster. Re-measured on 120 s of 1080p
# H.264 (Silo, ATVP WEB-DL): CPU 3.49 s, NVDEC 5.27 s, NVDEC scaled 5.10 s - and all three found
# the same 21 cuts, so 8-bit sources cost nothing in accuracy either way. What the GPU does buy
# there is CORES: 93-134% against the CPU path's 965%, i.e. one core instead of ten. On a machine
# sharing this WSL with other projects' containers, that can be worth 1.6 s a minute of film -
# set speech.cuts_decoder to the decoder name (h264_cuvid) per config to take it.
cuts_gpu_min_width = 2560
# The size NVDEC scales to while it decodes, for the cut detector only - never for anything that
# is heard or seen. Free on the GPU, and it is what turns 12.1 s into 5.0 s. A cut is a
# whole-frame event, so 960x540 sees it. Empty keeps full size. The CPU path never scales: there
# the frame is already decoded at full size by the time it could be, so scaling only adds work.
cuts_resize = '960x540'

[voice]
# elevenlabs | piper | chatterbox. elevenlabs costs money and sounds like broadcast; piper is
# free, runs on CPU and hits its time windows exactly, measured on a real 598-cue episode at 19.7
# s cold and 0.7 s once the cache is warm, 597 of the 598 lines inside their window; chatterbox is
# free and can clone a voice from a reference clip, but it needs the GPU and runs at RTF ~1.6
# against piper's 0.064, so an episode takes hours instead of minutes. Override for a single run
# with `--backend`.
backend = 'elevenlabs'

# Default parallel TTS calls. ElevenLabs caps this per plan. Flash/Turbo: Free 4, Starter 6,
# Creator 10, Pro 20, Scale/Business 30. Other models: Free 2, Starter 3, Creator 5, Pro 10,
# Scale/Business 15. 8 leaves headroom under the Creator/Flash cap of 10. A backend may override
# it in its own sub-table.
concurrency = 8

# The one backend that is neither free nor billed per character: it spends a weekly bucket of 80
# 000 credits that refills every 7 days and CANNOT be topped up at any price, so an episode either
# fits in what is left of the week or waits for the reset. A cloned voice bills at 2 credits per
# character, i.e. one 750-cue episode is roughly 46% of a whole week. Two more things set it
# apart. Every ~30 accepted tasks the service demands a GeeTest challenge that only a human can
# solve, in the same browser the session uuid came from: the run stops ITSELF with exit code 75,
# prints the link, and the same command finishes the rest from cache afterwards. And a line is
# never bought twice – the request always goes out at speed 1.0, the audio is cached under exactly
# what was asked for, and the time window is closed locally with atempo, so retiming a cue into a
# different window costs zero credits.
# Pinned. level_clips re-levels every cue to the median within +-4 dB, so a constant gain is
# undone anyway, while volume above 100 risks clipping inside the returned 16-bit PCM. pitch
# shifts the formants and destroys speaker identity between lines. pitch is also ignored on the
# clone path – clone_task does not take it.
[voice.trim]
# How the dead air an engine pads around an utterance is cut off. Shared by every backend that
# speaks – elevenlabs, kikivoice and omnivoice all hand their audio to the same trim_silence –
# because the thing being removed is a property of TTS, not of one vendor.

# Level, relative to the clip's own peak, under which a 10 ms frame counts as not speech.
floor_db = -45.0
# Padding left on both ends so the speech never starts or stops on a hard edge.
keep_ms = 40.0
# Shortest cosine taper laid over a trimmed end. Grows up to 25 ms when the edge is loud; see the
# note in audio.py for why a fixed 8 ms is itself audible on the loud ones.
fade_ms = 8.0

# The three keys below decide when a final run of voiced frames is an artefact to be thrown away
# rather than the end of the line. All three have to agree before anything is dropped.

# Longest such run that may be treated as an artefact. The measured one was 60 ms.
blip_ms = 150.0
# Silence that must sit between the speech and that run before it counts as detached. Raised from
# 100 to 200 because 100 cannot tell a stray burst from a Polish final plosive: the closure of a
# /k/, /t/ or /p/ is 60–130 ms of near-silence and the release that follows is 20–40 ms, which is
# precisely the shape this rule hunts. On a one-syllable card that release is not decoration – it
# is the difference between "tak" and "ta", and dropping it is what makes short lines sound cut
# off. The artefact this rule was written for sat behind 200 ms of TRUE silence, so it is still
# caught here with room to spare; no closure reaches that far.
blip_gap_ms = 200.0
# How much speech has to be left standing for the drop to go ahead at all. Below this, whatever
# would remain is itself no longer than a syllable, which means the rule is about to eat part of
# the word instead of something appended after it. The measured artefact had 2660 ms of speech in
# front of it and is unaffected; a one-syllable card has a few hundred and is protected. Set 0 to
# go back to trimming on the two conditions above alone.
blip_min_keep_ms = 350.0

[voice.kikivoice]
# Empty = the client's own default, ~/.config/kikivoice/session.json. There is no API key for this
# service: identity is the uuid cookie lifted from a browser session, and that file also carries
# the verification counter and the last quota snapshot. KIKIVOICE_UUID overrides the uuid for a
# single run.
session_path = ''

# library = a ready voice from the kikivoice catalogue (credit_rate 1.0); clone = a voice cloned
# from our own sample (kiki_core, 2.0x). The clone costs 46% of the weekly bucket per episode
# instead of 23%.
mode = 'clone'

# Which catalogue voice_code/voice_id are looked up in, and one of the two inputs to the credit
# rate when credit_rate is 0: standard bills 1.0, the premium tiers more.
library_type = 'standard'

voice_code = 'S089'
# Used only when mode=library. S089/standard_30002 is Rafael, the only Polish male voice in the
# standard catalogue. It stays filled in under mode=clone too, because cps_path builds the
# calibration filename out of voice_id and model_id.
voice_id = 'standard_30002'

# Not read by the backend at all – it is read by config.cps_path and by the voice stage report,
# both of which take model_id from whatever backend is active. Kept equal to model_type so the
# calibration file and the report name the model that was actually used.
model_id = 'kiki_core'

# kiki_core: 34 languages including Polish, max_text_length 1000, credit_rate 2.0, no emotions.
# kiki_multilingual would allow 2000 characters per task, i.e. half the manual GeeTest stops, but
# it has not been verified on the cloning path. kiki_pro has NO Polish. Left empty under
# mode=clone it is normalised to kiki_core before the rate and the character limit are computed.
model_type = 'kiki_core'

# Language tag sent with every task. It also selects the pronunciation of digits and
# abbreviations, so it has to match the script language, not the speaker.
lang_name_code = 'pl'

# What comes back is always PCM s16le mono 24000 Hz whatever this says. That is worse than
# ElevenLabs' mp3_44100_128 and cannot be improved; decode_mono resamples up to mix.sample_rate.
audio_format = 'wav'

# 0 = read the limit from tts-model-capabilities during prepare(). No single cue in this episode
# comes near 1000 characters (the longest is 120); the limit matters because the batcher packs
# many cues into one task.
max_text_length = 0

# 1 = the service's high-quality mode, which is its default and the only value ever rendered here;
# 0 has never been auditioned. It is not free of consequences even though it costs no extra
# credits: it goes into the cache key alongside text, voice, model, speed, volume, pitch and
# audio_format, so flipping it re-buys every line of the episode.
audio_high_quality = 1

volume = '100'
pitch = '1'
# Not used to predict durations (this backend reports needs_calibration=False), only as a sanity
# check on segment length when the batch is cut apart. Measured: 16.04 chars/s on a single call,
# 18-20 inside a batch, because the model reads straight through.
chars_per_second = 18.5

# 0 = derive it from library_type and model_type (standard 1.0, kiki_core and kiki_multilingual
# 2.0, kiki_pro 3.0). It is what turns characters into credits in the floor check, so a wrong
# value here makes the run stop half an episode too late.
credit_rate = 0

# NOTE: this is an EXPLICIT exception to the global timing.max_atempo = 1.0, which stays untouched
# for ElevenLabs. That decision was made listening to 44.1 kHz material; kikivoice returns 24 kHz,
# where the narrower band masks part of the resampling artefacts, and atempo 1.15 was auditioned
# separately on it and accepted. The server-side speed is an exact linear time scalar and in the
# 1.0-1.2 band practically indistinguishable from local atempo (spectral envelope correlation
# 0.93), so we always render at 1.0 and fit the window locally from cache. The point: retiming a
# line into another window costs ZERO credits. request_speed_mode is currently inert – both
# branches return request_speed.
[voice.kikivoice.timing]
request_speed_mode = 'fixed'
request_speed = 1.0
local_atempo_max = 1.2

# concurrency governs network tasks (measured: 24 tasks at 3 went through in 27 s, zero
# rejections; the cluster reports 7 nodes) and is clamped by concurrency_max. cpu_concurrency
# governs render() once the batcher has already bought the episode – at that point render() is a
# disk read plus ffmpeg, so 8 threads is CPU work, not requests. read_timeout_s is 90 rather than
# the backend default 60: a full batch takes 18.4 s to generate and the poll that carries it has
# to outlast a slow node.
[voice.kikivoice.net]
concurrency = 3
concurrency_max = 4
cpu_concurrency = 8
first_poll_delay_s = 2.5
poll_interval_s = 1.5
connect_timeout_s = 10
read_timeout_s = 90
max_retries = 4

# verify_budget is the measured GeeTest threshold: ~30 accepted tasks, independent of time and
# concurrency (29 tasks in 27 s at concurrency 3 and 30 tasks in 86 s at concurrency 1 – the same
# threshold). Polling and sample upload do NOT count. verify_reserve stops the run one task early,
# so the halt is ours and the state stays consistent instead of being a 777 mid-batch.
# credit_floor is what is left untouched in the weekly bucket, so a run started by mistake cannot
# eat the whole week.
[voice.kikivoice.budget]
verify_budget = 30
verify_warn_at = 24
verify_reserve = 1
credit_floor = 3000
credit_warn_ratio = 0.2

# char_budget counts BILLED characters, i.e. text without the separators: the server strips the
# pause markers before it applies max_text_length and before it counts credits (measured: 1198 raw
# characters with 23 separators went through as 922 under a limit of 1000). A requested 1200 ms
# yields a real 1280-1380 ms gap, and the longest prosodic pause measured in comma-heavy material
# did not reach 900 ms, so the two populations stay separated by the whole band – which is what
# lets the cutter find the seams. cut_margin_ms is how much of that silence is left on each side
# of a cue; cutting in the middle of the gap clipped word onsets.
# 700/25, not the backend defaults 850/40. Measured in production: a batch of 32 cues and ~758
# characters of text went through (18.4 s of generation), while 40 cues and ~838 characters came
# back AI_SERVER_ERROR AFTER 1754 credits had already been taken. That is not the max_text_length
# limit but a practical ceiling of the cloning model, documented nowhere. This sits below it with
# room to spare.
[voice.kikivoice.batch]
# The batcher is what makes this engine usable at all: one task per line on a 759-cue episode is
# ~25 human GeeTest solves, batched it is 47 tasks and 2. Set it to false only to reproduce a
# single cue in isolation.
enabled = true

char_budget = 700
max_cues = 25
# Ordered pause between cues inside one task, in ms.
pause_ms = 1200

cut_margin_ms = 40

# Both server-side preprocessing of the sample: denoise cleans the recording, asr transcribes it
# so the clone gets the reference text. Measured on this sample, turning asr off made the clone
# drift in vowel length.
[voice.kikivoice.clone]
# Our own reference recording, 6.7 s. The server keeps an uploaded sample for 86400 s, so the
# client re-uploads it once a day; the cache key deliberately does NOT contain custom_voice_id, so
# that daily re-upload does not invalidate the whole episode. The client enforces its own 5-120 s
# bounds on the sample, and there is no config knob for them.
sample_path = '~/voice-samples/lektor.m4a'

denoise = 1
asr = 1
# 0 = upload the sample whole. A number trims it to that many seconds from the start, which is the
# knob for a sample whose tail carries music or a second speaker.
trim_s = 0

[voice.elevenlabs]
# Public library voice, not in the account collection: /v1/voices/{id} answers voice_not_found
# while /v1/text-to-speech/{id} answers 200, so it is usable but cannot be listed. Calibrated
# 2026-08-20: 16.92 chars/s measured against Bill's 14.888, i.e. 14% faster; the duration model
# was re-fitted on the 36-line stratified corpus and came back at 67.29 ms/char with a non-
# negative intercept, which is the shipped 0 + 67.0 within noise, so no budget moved. Line-to-line
# loudness spreads 3.5 LU between the 10th and 90th percentile - wider than Bill's 2.3 but inside
# per_cue_level_max_db, and well clear of the 4.7 that got Janski rejected. Previously: Bill -
# Wise, Mature, Balanced. Back after a trial of Janski eQFIuH2hmjAMzpf75y69, which was rejected by
# ear for loudness artefacts: its delivery spreads 4.7 LU between the 10th and 90th percentile
# line against 2.7 for Mateusz, and per-cue levelling bounded at 4 dB could not hide it. Also
# valid: Mateusz MM9TwXLP67IpAXY0UOGg. The two rates disagree for this voice where they agreed for
# Bill (14.888 against 14.93), and the disagreement is real rather than an error: `calibrate`
# reads six lines of 43-63 characters, which is exactly the band where the straight line over-
# predicts most (+382 ms median), while the fit spans 6-170. They govern different things and both
# stay as measured - 16.92 tells the backend how much speed to ask the API for, 67.0 ms/char sizes
# the character budgets - so the budgets stay conservative while the engine is rarely asked to
# hurry. Watch the over-budget count in the voice stage report: if long lines start overrunning,
# this pairing is the reason and chars_per_second is the knob.
voice_id = 'Ix8C14HEHgIQkJswik2o'

# eleven_flash_v2_5 is flat, cheap ($0.05/1000 chars) and gets 2x the concurrency;
# eleven_multilingual_v2 and eleven_v3 are warmer at $0.10/1000 chars. Compare them with
# `lektor.py sample`.
model_id = 'eleven_flash_v2_5'

# Must stay in the mp3_* or opus_* family: the cache is decoded with `ffmpeg -i pipe:0`, which
# cannot read headerless PCM. mp3_44100_192 needs Creator or better.
output_format = 'mp3_44100_128'

# Hard API limit on voice_settings.speed, documented as 0.7-1.2. Anything above it is rejected, so
# this clamps timing.max_speed; what does not fit at 1.2 is stretched locally with atempo, which
# is free.
speed_max = 1.2

# Attempts per line against 429/500/502/503 only. 401, 402 and 422 mean the same thing every time
# and surface at once instead of sleeping five times.
max_retries = 5

# Send previous_text / next_text with every line, so the engine reads it as part of a continuous
# delivery instead of as an isolated sentence. Free in API cost, and part of the cache key:
# turning it off re-reads the whole episode.
send_neighbour_text = true

# 'neighbour_smoothed' plans every line's speed over the whole episode, spreading a crowded line's
# speed-up across its neighbours (timing.speed_smooth_s, timing.speed_relax). 'per_line' asks each
# line to fit its own window alone, which is heard as the lektor suddenly hurrying and then
# stopping. Smoothed is what shipped.
speed_plan = 'neighbour_smoothed'

# voice_settings sent with every call. speed is NOT here: it is computed per line from the
# measured chars/second and clamped by speed_max. style above 0 makes a lektor act, which is the
# one thing he must not do. stability was 0.6 here and 1.0 in the renderer that actually produced
# all six episodes -- the config was simply wrong, and every line on disk is keyed on 1.0. At 1.0
# the voice stops acting, which is the whole point of the profile.
[voice.elevenlabs.settings]
stability = 1.0
similarity_boost = 0.75
style = 0.0
use_speaker_boost = false

[voice.piper]
# Downloaded from rhasspy/piper-voices on first use. The Polish shelf is pl_PL-darkman-medium
# (male, flat, unexpressive - the lektor profile), pl_PL-bass-high (male, high tier, ~3x slower to
# synthesise), pl_PL-mc_speech-medium (male, clipped and clerical), pl_PL-gosia-medium (female)
# and pl_PL-mls_6892-low (male, audibly rough). All single-speaker, all 22050 Hz.
voice = 'pl_PL-darkman-medium'

# Where the .onnx and its .onnx.json are kept. Outside the work dir on purpose: the voice is 63 MB
# and is shared by every show, while the work dir belongs to one release. A half-written download
# is deleted rather than left behind, because piper skips re-downloading any file that already
# exists and is non-empty.
voice_dir = '~/.cache/lektor-ai/piper-voices'

# Overrides voice/voice_dir with an explicit path to an .onnx (its .onnx.json must sit next to
# it). Empty means use the downloaded voice.
model_path = ''

# Speaker id inside a multi-speaker model. Every pl_PL voice on the shelf is single-speaker, so 0
# means 'the voice's own default' and there is nothing else to pick.
speaker = 0

# Piper's direct duration knob: larger is slower, and it doubles as the search ceiling because a
# lektor is only ever asked to hurry. 1.0 is the voice's natural rate; lines that already fit are
# spoken at it and never touched again.
length_scale = 1.0

# Acoustic sampling noise, the model's own default. It colours the timbre, not the length, so it
# is safe to move; noise_w_scale is the one that must stay at 0.
noise_scale = 0.667

# The stochastic duration predictor, and the reason the search is exact. At the model default of
# 0.8 the same text at the same length_scale measured 4783-5050 ms across eight runs, 5.4% of
# jitter against a 60 ms tolerance; at 0.0 the duration is bit-exact reproducible. It also
# flattens the prosody, which is the lektor profile anyway.
noise_w_scale = 0.0

# Floor of the length_scale search, i.e. how fast this voice may be pushed: 0.6 is about 1.67x the
# natural rate and is already at the edge of what stays intelligible. A line that does not fit
# even here is handed back at the clamp and reported as clamped rather than silently overrun; on
# the real 598-cue episode that was 4 lines, worst overrun +16%. Those are the condensation
# stage's problem, not the voice stage's.
search_min = 0.6

# Ceiling of the search, only ever reached through length_scale itself: the search starts at
# length_scale and moves down, because a lektor is asked to hurry and never to dawdle. It exists
# to keep an edited config from asking for a two-minute reading of a two-second cue.
search_max = 1.6

# Probes allowed after the first, natural-rate reading. Measured over the real 598-cue episode:
# 2.24 syntheses per cue overall, 374 cues fitting on the first reading and never probed at all,
# 224 shortened to within 1.1% of their window at the median.
search_iterations = 6

# How far under the window counts as landed. It cannot be met exactly on short cues - phoneme
# lengths are rounded to whole decoder frames, so a 30-character cue moves in 20-80 ms steps - and
# the search stops on its own once the bracket is finer than the steps. Undershoot is harmless
# anyway: the leftover is silence between lines, and the search always returns the SLOWEST rate
# that still fits.
tolerance_ms = 60

# onnxruntime intra-op threads PER UTTERANCE, deliberately 1. Measured over 150 real cues: auto
# (16) threads x 1 worker = 9.9 cues/s, 1 thread x 16 workers = 35.2 cues/s. These clips are 1-4 s
# long, so onnxruntime's pool spends its time synchronising. CPU only: CUDA renders an episode in
# 136.5 s against CPU's 138.4 s and has already failed once with an onnxruntime EP error, so there
# is no GPU switch here. Do not add onnxruntime-gpu.
threads = 1

# Worker threads over one shared session, measured: 4 -> 20.6 cues/s, 8 -> 30.1, 12 -> 34.7, 14 ->
# ~35, 16 -> 35.2, 20 -> 32.6. It plateaus at the core count and degrades past it. Capped at 14 of
# the machine's 16 by owner rule - other containers share this WSL instance and must keep a core -
# which costs about 1% against the 16 the curve peaks at. Parallel output was verified bit-for-bit
# identical to serial.
concurrency = 14

# Do NOT reinstate this while trim_silence runs, which is why it ships at 0. The model appends a
# constant tail - measured under compression at exactly target + 200 ms, six times out of six with
# zero variance - but that tail is SILENCE, and trim_silence takes it off downstream, so after
# trimming the speech lasts about as long as the duration asked for. The first version subtracted
# it from the ask as well and thereby spent it twice: every line came out a fifth of a second
# shorter than its window allowed, which on a short card is most of the card, and short lines came
# back as an unintelligible scramble. Cue 14 "Rywali razem." keeps 784 ms after lead_in and was
# being asked to fit 553 ms against a natural length near 1280 ms. The knob survives only for a
# setup that disables trimming.
# Absolute floor under the ask, whatever the card. There is a second, better floor in the backend:
# the ask is never less than the same words spoken at timing.max_speed against the fitted duration
# model, i.e. the exact ceiling every other engine here obeys. A window tighter than that is
# simply overrun, which the mix tolerates and the report counts - an overrun is recoverable, an
# unintelligible line is not.
[voice.omnivoice]
# Python 3.11 venv with torch and omnivoice (pip install omnivoice). The model is held by a worker
# subprocess launched from it and spoken to over a JSON pipe, so the pipeline itself never imports
# torch.
venv = '~/.cache/lektor-ai-omnivoice/venv-omnivoice'

model = 'k2-fsa/OmniVoice'
# The voice to clone, 3-10 s per upstream; longer slows inference and can degrade the clone. Kept
# outside the repo on purpose – it is a recording of a real person, not source code, and whose
# voice you clone is your business and your licence to sort out. The one measured here was 5.2 s
# cut from the middle of a continuous reading, high-passed at 60 Hz, pulled down 3 dB for headroom
# because the source peaked at -0.1 dB, trimmed, mono 24 kHz.
reference_wav = '~/.cache/lektor-ai-omnivoice/reference.wav'

# Polish is entry 461 of 646 in the model's language table with 911.68 hours of training data -
# solid, though far from the English tier.
language = 'pl'

dtype = 'bfloat16'
# Diffusion steps. Upstream offers 16 for faster inference; 32 is the default and what every
# measurement in the backend docstring was taken at. Changing it changes the waveform and
# therefore every cache key.
num_step = 32

seed = 1234
duration_pad_ms = 0.0
# Shortest duration ever asked for, whatever the window says. It binds on exactly one kind of cue:
# a one- or two-word card whose subtitle slot is tight, where the ask would otherwise come out
# under half a second and the model answers by clipping the word rather than by speaking briskly.
# Raised from 400 to 550 on the owner's report of one-syllable lines arriving cut short. Unlike
# every other number in this file that is a JUDGEMENT, not a measurement – nothing here has been
# fitted against a listening test, and 550 is simply the length a short Polish word plus its
# release actually occupies. It costs nothing anywhere else: any cue with a real window already
# asks for far more than this, so the floor never enters the calculation there.
duration_floor_ms = 550.0
# Lines generated per call by the prewarm hook, each with its own duration. This is the single
# number that decides whether this engine is usable: measured on six lines, batched ran 4.4x
# faster than one at a time (RTF 0.317 against 1.38), i.e. an episode in about five minutes of GPU
# instead of twenty. Accuracy does not suffer - 65 ms median after trimming batched against 55 ms
# unbatched. Costs VRAM: 3.96 GiB peak at batch 6 against 3.03 GiB of weights alone. Set to 1 to
# switch batching off and fall back to one call per line.
batch_size = 8

# An empty take is re-rolled on a fresh seed and never cached. Not hypothetical: on a 60 s slice 1
# of 23 lines came back as a zero-length array for an ordinary short line, and re-running nine
# such lines twice each reproduced it zero times - so it is the sampler, not the text. At that
# rate an episode would silently lose about thirty lines with nothing but one word in the clip
# report to show for it.
max_retries = 3

min_audio_s = 0.05
# A take is rejected and re-rolled unless it lasts at least this share of what the words need at
# timing.max_speed against the fitted duration model. The constant floor above catches only a
# total failure, and this model does not merely fail totally - it returns STUBS. Measured over one
# full episode at the old 50 ms floor: 100 of 759 takes came back under half the plausible length,
# most around 110 ms of audio for a whole sentence, and 217 under 85%. Shipped at 0.95 rather than
# 0.85 because 0.85 still waved through the line that started this: 17 characters need 949 ms at
# max_speed, the take was 870 ms (92%), and it plays as "to bylo F". A re-roll costs GPU time and
# nothing else. Worse, a stub fits any window, so they were counted as lines that landed inside
# their slot - the fit statistic was measuring nothing. "Nie. To bylo FBI." was asked for 1113 ms,
# returned 870 ms, and played as "to bylo F".
min_fill_ratio = 0.95

load_timeout_s = 900
render_timeout_s = 300
# Fixed at 1 by the backend whatever this says: one model, one GPU, one worker, one pipe.
concurrency = 1

[voice.chatterbox]
# python 3.11 with torch and chatterbox already installed. Reuse it; do not reinstall. The
# pipeline itself runs on python 3.13 and has no torch, so the model is held by a worker
# subprocess launched from this venv and spoken to over a JSON pipe.
venv = '~/.cache/lektor-ai-chatterbox/venv-chatterbox'

# bfloat16 | float32. THIS IS THE FIX FOR BOTH RECORDED CRASHES, do not set float16. T3's CFG
# combine and the temperature divide push logits past the float16 ceiling; they saturate to inf,
# softmax turns that into nan and torch.multinomial raises a device-side assert that poisons the
# CUDA context for the rest of the process. Measured on a 24-generation grid over temperature
# 0.5-1.0 x cfg_weight 0.3-0.7: float16 died on generation 1, bfloat16 passed 24/24 at 2607 MiB,
# float32 passed at 3716 MiB and is about 12% faster. bfloat16 is the default because it fits even
# the ~2.6 GiB budget WDDM hands a WSL2 process on a busy desktop. float16 is refused with a named
# error rather than silently accepted.
dtype = 'bfloat16'

# Language tag for the multilingual model, passed straight to generate(). It selects the grapheme
# set, so a Polish script read under another tag comes out mispronounced rather than merely
# accented.
language_id = 'pl'

# Voice cloning reference; empty means the model's builtin speaker. Cloning WORKS once dtype is
# not float16 - the old failure was 'mat1 and mat2 must have the same dtype, but got Float and
# Half', because prepare_conditionals builds float32 conditionals and float16 weights refuse them,
# and the backend now casts them at T3's entry point. Verified with the model's own voice encoder:
# a cloned clip sits at cosine 0.82-0.85 to the reference against 0.63-0.67 for the builtin voice.
# Give it a clean single-speaker clip of 8-20 s; container and sample rate do not matter because
# librosa resamples. The clone copies the reference's LOUDNESS too, so a quiet reference makes
# quiet speech - harmless, since the mix stage normalises the voice against the programme.
reference_wav = ''

# Emotional intensity. A lektor is deliberately flat, so leave it at the neutral 0.5; it also
# changes nothing about duration.
exaggeration = 0.5

# Classifier-free-guidance weight, how hard the model is pushed toward the text. 0.3-0.7 were all
# stable in bfloat16. It is one of the two knobs that overflowed float16, so raising it on float16
# is the fastest way back to the CUDA assert.
cfg_weight = 0.5

# Sampling temperature. 0.5, 0.65, 0.7, 0.8, 1.0 and 1.3 all generated cleanly in bfloat16; the
# crash blamed on temperature was the float16 overflow, which the divide by a temperature below
# 1.0 merely made likelier.
temperature = 0.8

# Only re-rolls takes. The per-line seed is derived from the cache key, so the same text under the
# same settings always yields the same reading; change this to get a different one.
seed = 1234

# How long the ready handshake may take. It covers snapshot_download plus a warmup generation,
# measured at 11-45 s once the model is in the HF cache and minutes on the very first run, which
# is why it is this generous.
load_timeout_s = 600

# Ceiling on one line. Generation is bounded by max_new_tokens=1000 at roughly 24 tokens/s, so
# this is far above anything real and exists only to turn a hung worker into an error instead of a
# hang.
render_timeout_s = 300

# Fixed at 1; the backend ignores any other value. One model on one GPU behind one worker process
# with one request/response pipe, 2607 MiB resident, RTF ~1.6. Extra threads would only queue on
# that pipe.
concurrency = 1

# Every level is relative to the programme's own measured loudness, never to dBFS. The first cut
# used an absolute voice_target_dbfs of -18 and buried a quiet film under a lektor 25 dB above it;
# the same setting would have been too quiet on a loud one. All three numbers below were then set
# by ear on a real scene.
# The limiter is sample-accurate: instantaneous attack, one-pole release over limiter_release_ms,
# and the reduction is carried across the 10 s encode blocks so a peak never steps the gain at a
# block seam. A peak therefore pulls down its own neighbourhood and nothing else. Shorter releases
# recover faster and pump more; 120 ms is long enough to hold a reduction across a syllable and
# short enough to be back before the next line.
# High shelf on the lektor, matched by measurement rather than taste. Two voices at the same
# loudness are not equally present: band by band at equal RMS, Mateusz had 3.6 dB less above 4 kHz
# than Bill, where consonants live, and that reads as further away and quieter. A shelf of 6 dB at
# 4 kHz puts his 4-8 kHz band at 57.6 against Bill's 57.5, so the two are interchangeable in tone.
# Re-measure when changing voice_id; turning the fader up instead only makes the mud louder. Re-
# measured for voice_id Ix8C14HEHgIQkJswik2o on 12 lines at equal RMS: it is not rolled off, it is
# DIPPED - 6.2 dB under Bill at 2-4 kHz and 5.6 dB under him at 4-8 kHz, while 8-16 kHz already
# matches him to 0.6 dB. A shelf can only fill a mid dip by paying in air above it, so the corner
# moves down: at 2000 Hz the same top-end cost buys 2.2 dB more of the 2-4 kHz band back than at
# 4000 Hz, which makes 2000 dominant rather than merely different. At 7 dB the 4-8 kHz band lands
# on Bill's exactly (+0.0 dB), 2-4 kHz closes from -6.2 to -2.3, and 8-16 kHz sits +5.7 dB over
# him - that overshoot is the price of the filter shape, not a target, and it is the thing to
# listen for if the lektor ever reads as sibilant.
# Per-voice level nudge on top of voice_over_program_db, for when the tone is right and the
# balance still is not. Cheap to retune: the speech is cached, so only the mix is rebuilt.
# The band the lektor competes for. Below it is weight and above it is air, neither of which masks
# speech. Split with a Linkwitz-Riley crossover (ffmpeg acrossover) because the two halves must
# sum back to the original when their gains are equal; band-passing the middle and calling the
# difference the rest does NOT work, since an IIR band-pass shifts phase and the difference still
# carries the midrange at full level. That shortcut measured 6.8 dB LOUDER in the speech band than
# broadband ducking, the opposite of the intent.
# How far the speech band drops under the lektor in spectral mode. Deeper than it was: the first
# cut sat at -11 and the lektor still blended into the bed, and this is the only band being
# touched.
# Bass and air under the lektor. Barely moved, so the film keeps its weight - but no longer
# untouched, because at 1.5 dB a loud passage still crowded the voice.
# Internal pauses the engine inserts, mostly at commas. Measured over 476 of them: median 180 ms,
# p75 320, p90 510, max 700, and a line with two commas spends 23% of its length not speaking.
# pause_ratio is how much of each pause ABOVE pause_floor_ms survives - 1.0 leaves them alone. The
# floor is where a gap stops being heard as a pause and reads as articulation, so it is never
# taken; only the excess is compressed, which keeps a sentence boundary longer than a comma
# instead of flattening both to the same length the way a flat scaling would.
[mix]
sample_rate = 48000
# Layout of the finished track: '5.1(side)' or 'stereo'. 5.1 is what ships -- the lektor lands on
# the centre channel, where dialogue lives and where a stereo downmix folds it evenly into both
# speakers, and every other channel keeps its own material. Stereo is the fallback for a source
# that has no surround track; the mix then carries the voice on both channels. The layout also
# picks the encode profile below.
channel_layout = '5.1(side)'

# Momentary loudness, in LUFS, above which the centre channel counts as carrying dialogue. The
# speech gate asks "is anybody speaking under this cue" of FC alone, so an empty FC on a 5.1
# source empties the gate and lets title cards into the dialogue reference. When the loudest 5% of
# FC sits below this, the mid signal (0.5*FL+0.5*FR) answers the question instead - the same
# substitution a stereo source already gets. Real dialogue peaks at -20 to -15 LUFS momentary; the
# empty centre measured on Grand Theft Auto VI never rose above -70.
centre_silent_lufs = -60.0

# Output channels the lektor is laid onto, in ffmpeg's 5.1(side) order FL FR FC LFE SL SR. [2] is
# FC. Ignored in stereo, where the lektor is laid on both channels at full level -- which is why
# voice_channel_comp_db is 0 there: two correlated channels already sum the 3 dB the centre-only
# case has to buy back.
voice_channels = [2]

# Level compensation for putting the voice on ONE channel instead of two. Every level in this mix
# was tuned against a stereo fold, where L and R sum 3 dB; the centre channel alone does not, so
# without this the lektor lands 3 dB quieter than the number voice_over_program_db promises. It is
# a correction, not a taste knob -- voice_over_program_db is the taste knob.
voice_channel_comp_db = 3.0

# How the programme's own loudness is measured, and every level in the mix hangs off it.
# 'stereo_fold' downmixes the source to two channels first, which is what the mix was tuned
# against; 'as_is' measures whatever channels the source has, and on a 5.1 source the LFE and the
# surrounds move the number enough to unbalance the whole thing.
level_reference = 'stereo_fold'

# Lektor RMS above the programme RMS. Raised for this voice on request, and then raised again by a
# further 1.0: the target is set in RMS but a listener hears LUFS, and a change of voice changes
# the relationship between them - the first 1.5 dB of RMS came out as 0.5 LU on the centre
# channel. Verify by measurement after any voice change.
voice_over_program_db = 9.5

# Where the original sits while the lektor speaks, relative to its own level. -4.5 by the owner's
# ear, after -10, -6 and -4 were compared on the same film. Deeper than about -10 stops making
# room in the scene and starts erasing it.
duck_to_db = -3.0

# What happens to the film where the lektor is NOT speaking, relative to its own level. 0.0 means
# the film is left exactly as it was, which is the default a lektor track should have: it is not
# our business to re-master the film. It was 4.0 for Ted Lasso, whose mix ran quiet; for a film
# that is already at a sensible level, lifting it costs headroom for nothing - the stereo downmix
# of the boosted track peaked at +1.20 dBFS against the original's -2.74, i.e. it clipped where
# the source never did.
program_gain_db = 0.0

# Time constant of the duck going down. Short, because the pre-roll only helps if the fall
# completes inside it.
attack_ms = 90

# How slowly the original climbs back once the lektor really has finished. Slower than the attack
# on purpose, and slower still since hold_ms landed, because every remaining recovery is now a
# real one and should feel gradual.
release_ms = 600.0

# How long before the lektor speaks the duck begins. Measured at the old 250 ms with a 180 ms
# attack, the bed was still only 4.5 dB down when the voice arrived - 6.5 dB short of its target -
# and did not reach depth until half a second INTO the line. That is heard as two people talking
# at once, which is exactly what it was.
pre_roll_ms = 450

post_roll_ms = 350
limiter_ceiling_db = -1.0
limiter_release_ms = 120
# Keep the original ducked through any gap shorter than this instead of letting it climb back and
# drop again. Measured without it on one episode: 324 full recoveries, 198 of them under a second,
# the programme swinging 11 dB at up to 52 dB/s between neighbouring lines. That pumping is what a
# listener hears as the film being chopped; holding through the short gaps removes it and costs
# only the brief moments of original audio nobody was going to hear anyway.
hold_ms = 1500.0

voice_presence_db = 7.0
voice_presence_hz = 2000.0
voice_trim_db = 1.5
# broadband | spectral. Switched back to broadband after the owner reported a phaser-like
# colouration that survived the crossover fix. Spectral ducking is not a bug here - the mix was
# measured against an independent reference and nulls at the E-AC-3 coding floor (-48 dB), static
# and time-varying alike - but by construction it sweeps an 11 dB dip through 300-4000 Hz on every
# line, attack 90 ms and release 600 ms, and a moving midrange notch is what a phaser is.
# Broadband simply turns the film down, which is what a lektor mix has always done. S02E10 is kept
# as the spectral reference for an A/B.
duck_mode = 'broadband'

duck_band_hz = [300, 4000]
duck_mid_db = -14.0
duck_rest_db = -3.0
pause_ratio = 0.35
pause_floor_ms = 120.0
pause_floor_db = -30.0
pause_min_ms = 60.0
# Level every line to the median before placing it. The track-wide normalisation sets one gain for
# the whole episode, so a voice that wanders takes the listener with it. Bounded at
# per_cue_level_max_db so a whisper stays a whisper and only the drift is removed.
per_cue_level = true

per_cue_level_max_db = 4.0
# Set the lektor against the loudness of the film's DIALOGUE instead of the RMS of the whole film.
# The old reference averaged silence, music and action together, so on a sparsely-talking film it
# sat far below the scenes the lektor has to be heard over: +9.5 dB 'over programme' measured as
# roughly 18 dB over the dialogue itself. Dialogue windows come from the Polish cue timings, gated
# by the centre channel so title cards and song lyrics do not count.
dialogue_reference = true

# How far the lektor sits above the film's dialogue. The unit is LU, not dB and not LUFS: it is
# the DIFFERENCE between two BS.1770 measurements, the way dB is a difference on the dBFS scale.
# Anything that merely multiplies a signal - duck_to_db, voice_trim_db, limiter_ceiling_db - stays
# in dB. 6.0 is the owner's starting figure and the only number here not yet confirmed by
# measurement.
voice_over_dialogue_lu = 6.0

# Window the local dialogue average is taken over for the fader ride. Short enough to follow a
# scene, long enough not to follow a sentence.
dialogue_window_s = 20.0

# How much of the scene's loudness the lektor follows. Deliberately below 1.0: at 1.0 the voice
# would copy the film's dynamics exactly and the whole point of having a fixed reference would be
# gone. At 0.5 a scene 6 LU louder lifts the voice 3 dB.
ride_tracking = 0.5

# Ceiling on the ride, in dB, either way. A hand on a fader, not a compressor.
ride_max_db = 3.0

# Time constant of the zero-phase easing, applied forward and backward so the ride neither
# anticipates the picture nor lags it.
ride_smooth_s = 2.0

# false holds one level across each cue and eases between cues, which is what a lektor and a mixer
# actually do - the reader keeps a sentence level, the mixer rides between them. true follows the
# film continuously inside a line too; useful when a long line sits under a swell, but it
# modulates the voice's own dynamics and can read as breathing. Same cap and easing either way.
ride_within_cue = false

# A cue whose centre channel is this far below the typical cue's centre has nobody speaking under
# it - screen text, a sign, a lyric - and is excluded from the dialogue reference.
dialogue_speech_gate_lu = 12.0

# The STEREO profile. AC3 muxes into MKV and plays on everything, including dumb TVs. Set
# codec/extension to flac for a lossless handoff at ~3x the size.
[encode]
codec = 'ac3'
bitrate = '256k'
extension = 'ac3'
# Samples the encoder adds before its first output sample, compensated by advancing the source
# read by the same amount so the finished track is sample-exact against the film. Measured, do not
# guess: null the encoder's own output against its input and read off the best offset
# (tools/ab_mix.py --verify does this). ffmpeg's eac3 and ac3 both delay by 256; flac is lossless
# and delays by 0. It matters because any player that renders the internal track AND this one at
# the same time sums the film with a delayed copy of itself - a comb filter, notches every 188 Hz
# at 12.9 dB, which is audible as flanging on loud music.
delay_samples = 256

# Used when mix.channel_layout is a surround layout; ac3 at 256k cannot carry six channels
# credibly, so the profile is chosen by layout rather than shared. The codec was blamed for the
# artefacts reported on music and then cleared BY EAR, which is the only test that counts here. It
# does leave real error - measured on a 25 s music passage with the lektor silent, where the mix
# does nothing but apply a gain, the null against the source is -29.9 dB at 768k against -84.4 dB
# for flac, and the source is already Dolby Digital Plus with Atmos so this is second-generation
# lossy coding. But the owner compared that exact passage encoded both ways and rated them equal,
# so the measurable error is not the audible complaint. Lossless costs ~950 MB an episode against
# ~230. If the codec is ever suspected again, re-run that A/B rather than trusting the null
# figure: it is real and it is not what is being heard.
[encode.surround]
codec = 'eac3'
bitrate = '768k'
extension = 'eac3'
delay_samples = 256

# Markup, HI tags and parentheticals. Bracket stripping also removes on-screen-text glosses, which
# lektor does not read.
# Two cards are joined only when BOTH hold: the gap is no larger than this, and the first card
# does not finish its sentence. The gap alone proves nothing - this release puts a fixed 82-85 ms
# between every card, 55% of all gaps, and the next distinct value is 417 ms. Merging on the gap
# alone glued two finished sentences 89% of the time, including across shot changes, across
# speaker turns and onto on-screen title cards. Set to 0 to switch merging off. merge_gap_wide_ms
# is a SECOND, wider band added once the gaps were measured against the FRAME GRID rather than in
# milliseconds. On a fansub authored at 23.976 fps the gaps land on exact frame multiples: 83-84
# ms twice (338 of them), 125-126 ms three times (225), 167 ms four times, 208-209 ms five times
# (44). 140 fell arbitrarily between three frames and four, so every seam its author happened to
# space at four or five frames was refused - not because anybody paused, but because of where a
# constant landed. The ATVP releases this was originally tuned on have a different convention
# again: 427 gaps of exactly 0 ms. The wide band covers six frames and demands stronger evidence
# of continuation - the next card must open in lower case, which a continuation does and a new
# sentence does not. Raising the tight threshold outright was tried first and glued the recap
# title card "Poprzednio w NCIS" onto the sentence after it, four frames away, because that card
# carries no full stop and is_screen_text only knows the ALL-CAPS convention. Inside the tight
# band nothing changes, so no existing render moves. The EVIDENCE gate still decides, which is the
# only thing here that knows about real pauses: measured on one episode, of the 10 seams refused
# by the old threshold alone the gate accepts 7 and still refuses 3. The case that prompted this
# read "Carla Marino, matriarcha najwiekszej" + "zorganizowanej rodziny przestepczej na Srodkowym
# Zachodzie." - one sentence over two cards, four frames apart, condensed separately into a
# complete line and a stranded fragment that the lektor read as "rodziny przestepczej Srodkowego"
# and stopped.
# Shortest silence in the delivery that counts as the actors having paused. 300 ms is the
# threshold the effect was measured at, not one derived from a distribution, and it is the single
# knob that matters: across six episodes it takes the 211 text-rule merges to 95 at 200 ms, 124 at
# 300, 162 at 500 and 190 at 800. It is the honest place for a second opinion by ear, which is the
# only test that can settle it - the median silence sitting on a merge seam is 520 ms, comfortably
# above the threshold either way.
# Longest silence still read as a pause. Past this it is a stretch the aligner never covered - a
# scene with no subtitled speech in it - not a breath inside one sentence, and a hole in the
# evidence must not masquerade as evidence. MEASURED over six episodes: 118 merge seams have a
# silence of at least 300 ms on them, and 13 of those silences run 5.2, 6.4, 6.4, 11.2, 11.8,
# 11.8, 13.8, 25.9, 25.9, 25.9, 26.3, 27.0 and 51.0 SECONDS. A 51-second pause between two cards
# that are 83 ms apart and both carry dialogue is not something an actor did. The other 105 have a
# median of 520 ms. This cap is the only place this implementation is deliberately more
# conservative than the simulation the feature was designed from: uncapped, S02E06 reproduces that
# simulation almost exactly (570 cues, 22 merges, 246 over budget, 2148 chars of deficit against a
# predicted 571 / 21 / 247 / 2145); capped it keeps 7 more merges an episode that the simulation
# threw away on missing evidence.
# How far outside the 83 ms seam that silence may sit and still be about the seam. The alignment's
# own onset error against the card is p50 90 ms and p90 293 ms, so a tolerance below about 150 ms
# would start missing real pauses through timing noise alone, and one much larger would start
# catching the pause after the NEXT word. It is a weak knob and that is reassuring: over six
# episodes the merges land at 134 with no tolerance at all, 130 at 100 ms, 124 at 250 and 118 at
# 500, i.e. the signal is not an artefact of where the window is drawn.
# Widen the seam before looking for a shot cut. Zero because the seam is already the whole
# interval between the two cards and a cut inside it is unambiguous; padding trades a rare missed
# cut for refusing merges over cuts that happen mid-card, which is a different question.
# Guards on a merged utterance. Looser than the first attempt because the predicate is now narrow:
# with the old timestamp-only rule a 7 s cap chopped 571 of 1926 candidate joins, and 87 of those
# refusals landed mid-sentence - moving the hole rather than closing it.
[clean]
# Read a screen card once per episode, however many times it appears. A location caption or a shop
# sign carries the same information every time it is shown - S03E07 of Ted Lasso puts "U OLA" up
# three times and "SMAK ATEN" twice - and a lektor announcing it again is padding a viewer reads in
# a glance. Dialogue is never deduplicated: a repeated LINE is nearly always meant, which is what
# the narrow overlap rule in drop_repeated_cards exists to protect. Set false to read every card.
dedupe_captions = true
# A cue matching any of these never reaches the lektor at all. The note characters mark sung
# lyrics, which a lektor does not read over - the song is the scene. The pattern deliberately
# matches a note ANYWHERE, not the opening-and-closing pair it used to: '♪TRENERNATE -
# #AFCRICHMOND #WONDERKID' opens with one and never closes it, and slipped through to be read
# aloud.
skip_patterns = ['[♪♫]', '^\s*$', '(?i)napisy24', '\.::.*::\.', '(?m)^\s*(?:<[^>]*>)?\s*(?:Tłumaczenie|Synchronizacja|Synchro|Korekta)\s*(?:</[^>]*>)?\s*$']

strip_patterns = ['<[^>]+>', '\{[^}]+\}', '\[[^\]]*\]', '\([^)]*\)']
# Throw away a card whose text repeats the card it OVERLAPS in time, before the lektor reads it
# twice. Found on S03E04, where 16 pairs of cards share byte-identical timestamps AND byte-
# identical text and 9 more overlap - a duplicated authoring run, not a property of the format:
# the same test over all 10 017 Polish cards on this disk finds zero in the other seventeen
# episodes, so the guard is a no-op everywhere else and no existing render changes. The test is
# deliberately the overlap and not the similarity, because dialogue repeats itself constantly and
# a lektor has to read it - measured on the three clean episodes, every genuine repetition ("Roy
# Kent!" from two fans, a name asked then confirmed) sits 0.5 to 4.5 s apart and none overlaps,
# while every defective pair overlaps by 1.8 to 4.9 s. The survivor takes the union of the two
# spans. repeat_overlap_ms widens the test past pure overlap and should stay at 0: at 500 it would
# start eating real exchanges.
drop_repeated_cards = true

repeat_overlap_ms = 0
# Above this share of cards carrying a non-default font colour, colour stops being read as a
# caption marker. A fansub sets captions in COLOUR the way an official track sets them in
# CAPITALS, and on the one such release here 6 of 834 cards are coloured - two location captions,
# the recap and episode titles, a to-be-continued - and not one is dialogue. But a release that
# paints every line, or every italic, would carry the same markup with none of the meaning, and
# reading it as evidence there would refuse every merge in the file. So the rule disqualifies
# itself when colour stops being the exception, which is the same argument the merge gate makes
# about card contiguity. White is never a caption colour: white is what a subtitle already is. The
# 0.10 is chosen with an order of magnitude of headroom over the only observed case (0.7%), not
# measured - re-measure when a release turns up that colours more.
caption_colour_max_share = 0.1

merge_gap_ms = 140
merge_gap_wide_ms = 250
# ON as 'both', and the note below is the argument for the opposite - read both before changing
# it, because the file and its note disagreed for three days. History: the gate shipped as 'both'
# in a5f20a0, was deliberately turned off in 756e2cc with the reasoning that follows, and came
# back to 'both' in 5382ca3 - a commit about referencing the lektor to dialogue loudness, which
# says nothing about merging and left this note untouched. So the argued decision is the one for
# 'off' and the current value arrived without one. THE ARGUMENT FOR OFF, preserved verbatim in
# substance: The evidence was solid: half of all merges join across a pause the actors really took
# or a shot cut, 117 of 231 seams over six episodes. The conclusion drawn from it was wrong.
# Judged on 22 A/B pairs rendered both ways over the real audio with everything else held
# identical, merging won decisively - splitting a sentence at its comma, which is exactly where
# actors pause, made the lektor sound like it was reading word by word. A lektor is a narrator
# reading a text, not a performer imitating a delivery: he reads the sentence, and the pause in
# the picture is not his to copy. Set to 'pause', 'cut' or 'both' to re-enable; the speech.json
# artefact stays useful regardless, since the per-line delay job needs its onsets.
merge_gate = 'both'

merge_min_pause_ms = 300
merge_max_pause_ms = 5000
merge_pause_tol_ms = 250
merge_cut_pad_ms = 0
merge_max_cues = 4
merge_max_chars = 160
merge_max_span_ms = 9000

# Foreign names respelled the way a Polish voice must say them. Keep this list SHORT: the
# multilingual voice already reads English names correctly, and respelling those only breaks them.
# It is for names whose language is neither Polish nor English, where the voice falls back on
# Polish letter rules - Spanish 'Rojas' comes out 'royas' instead of 'Rohas'. Keys match on the
# STEM and the case ending follows automatically (Rojasa -> Rohasa, Rojasowi -> Rohasowi), so add
# the nominative only. This runs on EVERY cue, before budgets and before the LLM, unlike
# condensation which only touches cues that do not fit. Extend it by ear, per show.
[clean.pronunciation]
Rojas = 'Rohas'

# Symbols rewritten into the words a lektor actually says, applied to EVERY cue before budgets and
# before the LLM. Same reasoning as the pronunciation table: a short cue never goes to the model,
# so a '#' left in it would be read as whatever the voice makes of the glyph. The LLM handles
# digits; these are the marks it has no rule for.
[clean.spoken_symbols]
"#" = 'hasztag '
"&" = ' i '
"@" = ' małpa '

# Imperial measurements rewritten as metric. Deliberately narrow: mined over 26950 Polish subtitle
# lines from 44 films, a plain unit-name regex found 22 matches of which TWO were measurements.
# 'stopa' was a body part 12 times out of 12, 'funt' was pounds sterling 4 out of 4, and 'cali'
# was the adjective 'cały' - 'Wszyscy cali i zdrowi' would have become 'Wszyscy 2,54 cm i zdrowi'.
# So a unit converts ONLY when a numeral stands immediately in front of it and the line matches no
# idiom. 'pound' and 'ounce' are OFF by default because in British material a pound is money;
# enable them per show if the English track confirms mass. tolerance is how far a value may be
# moved to land on something a person would say - six feet becomes 1,8 m rather than 1,8288. A
# source written with decimals is treated as deliberate precision and is not snapped.
[clean.units]
enabled = true
convert = ['mile', 'foot', 'inch', 'yard', 'fahrenheit']
tolerance = 0.035
idioms = ['od stóp do głów', 'u stóp', 'palców u stóp', 'na stopach', 'stopy w górę', 'cal po calu', 'mila morska', 'mile morskie', 'zielona mila', 'ostatnia mila', 'sześć stóp pod ziemią', 'kosa na kamień', 'epoki kamienia', 'stopa procentowa', 'stopa bezrobocia', 'stopa zwrotu', 'stopa życiowa']
# Amounts written the English way are said the Polish way: the symbol comes first on the page and
# the number comes first in the mouth, so $10 is dziesiec dolarow and never dolar dziesiec. The
# VALUE is never converted - exchange rates move and a lektor quoting an old sum in todays zloty
# would be stating a falsehood. A three-digit group after the separator is read as thousands, one
# or two digits as cents.
currency = true

[pack]
# The language tag written into the .mka. This is the whole reason the track is wrapped in
# Matroska rather than handed over as a raw .eac3: a bare elementary stream carries no language,
# so a player told to prefer Polish audio has nothing to prefer, and the file lands as "Track 2".
language = 'pol'
# The track name a player shows in its audio menu.
title = 'Lektor AI (PL)'
